# ABAX Tracker — CI: testy + Lighthouse + dostępność
# Umieść jako: .github/workflows/ci.yml
#
# Joby:
#   1. tests      — aplikacja w prawdziwej przeglądarce (Playwright): brak błędów konsoli
#                   + wbudowany harness ?test (szukamy "[FAIL]" w konsoli)
#   2. lighthouse — Lighthouse CI na statycznej stronie (bez builda)
#   3. a11y-axe   — skan dostępności axe (WCAG 2.x AA)
#
# Po migracji na moduły ES można dodać krok `node --test js/` (testy warstw czystych w Node).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Po migracji na moduły ES odkomentuj:
      # - name: Unit tests (czyste moduły: logic/storage/validation)
      #   run: node --test js/

      - name: Install deps
        run: |
          npm install -g playwright http-server
          npx playwright install --with-deps chromium

      - name: Serve app
        run: http-server . -p 8000 --silent &

      - name: Smoke test + wbudowany harness ?test
        run: |
          cat > smoke.mjs <<'EOF'
          import { chromium } from 'playwright';

          const BASE = 'http://127.0.0.1:8000';
          const browser = await chromium.launch();
          const page = await browser.newPage();

          const errors = [];
          page.on('console', msg => { if (msg.type() === 'error') errors.push(msg.text()); });
          page.on('pageerror', err => errors.push(String(err)));

          // 1. Aplikacja ładuje się bez błędów konsoli
          await page.goto(BASE + '/index.html', { waitUntil: 'networkidle' });
          if (errors.length) {
            console.error('Błędy konsoli przy starcie:', errors);
            process.exit(1);
          }

          // 2. Kluczowa struktura: kontener aplikacji + toast
          for (const sel of ['#app', '#toast']) {
            if (!(await page.locator(sel).count())) {
              console.error('Brak elementu: ' + sel);
              process.exit(1);
            }
          }

          // 3. Wbudowany harness ?test — runSelfTests() loguje "[OK ] nazwa" / "[FAIL] nazwa"
          await page.goto(BASE + '/index.html?test', { waitUntil: 'networkidle' });
          await page.waitForTimeout(2000);
          const fails = errors.filter(e => /\[FAIL\]/.test(e));
          if (fails.length) {
            console.error('Wbudowany harness zgłosił błędy:\n' + fails.join('\n'));
            process.exit(1);
          }

          console.log('OK: smoke + harness ?test');
          await browser.close();
          EOF
          node smoke.mjs

  lighthouse:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3
          # Aplikacja mobile-first: domyślny preset (mobile).
          # Progi dokręć do baseline po pierwszym stabilnym przebiegu.

  a11y-axe:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          npm install -g playwright http-server @axe-core/cli
          npx playwright install --with-deps chromium

      - name: Serve app
        run: |
          http-server . -p 8000 --silent &
          sleep 2

      - name: axe scan (ekran główny)
        run: npx axe http://127.0.0.1:8000/index.html --exit --tags wcag2a,wcag2aa,wcag21a,wcag21aa