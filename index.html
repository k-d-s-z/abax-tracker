<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#130e0a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Abax Tracker" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>ABAX TRACKER</title>
<!--
  ABAX TRACKER — aplikacja bez bibliotek i bez zapytań sieciowych. Brak inline JS/CSS (CSP: self).
  Sekcje w js/app.js (ponumerowane, gotowe do dalszej dekompozycji na moduły ES):
    1. I18N   2. ICONS   3. CONFIG / STORAGE   4. STATE   5. LOGIC (model + walidacja)
    5b. TESTY (tylko ?test w adresie)   6. VIEWS   7. DIALOGS   8. AKCJE + PRZECIĄGANIE + ZDARZENIA
  PWA: sw.js, manifest, ikony oraz css/app.css i js/app.js (CORE w sw.js!) leżą obok tego pliku. css/app.css i js/app.js muszą być w CORE sw.js.
  Przy każdej nowej wersji zmień numer CACHE w sw.js.
-->
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
<main id="app"></main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="js/app.js" defer></script>
</body>
</html>
