    1. I18N (tłumaczenia)      5. LOGIC (czysty model danych + walidacja)
    2. ICONS                   6. VIEWS (render)
    3. CONFIG / STORAGE        7. DIALOGS
    4. STATE                   8. A11Y + DELEGACJA ZDARZEŃ + TESTY
  Rekomendowane konfiguracje po rozdzieleniu na moduły:
    .eslintrc.json: { "env": {"browser":true,"es2021":true},
      "extends":"eslint:recommended", "rules":{"no-unused-vars":"warn"} }
    .prettierrc: { "printWidth": 100, "singleQuote": true, "semi": true }
    Testy: uruchom z ?test w adresie albo przyciskiem w Ustawieniach.
  ============================================================
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  /* touch-action:manipulation wyłącza opóźnienie 300ms i double-tap zoom na mobilkach */
  :root {
    --bg: #070a12;
    --bg-grad: radial-gradient(circle at 50% 0%, #0f172a 0%, #070a12 75%);
    --card-bg: rgba(15, 23, 42, 0.75);
    --card-inner: #0f172a;

    --silver: #e2e8f0;
    --silver-light: #ffffff;
    --silver-dark: #94a3b8;
    --silver-grad: linear-gradient(135deg, #94a3b8 0%, #f1f5f9 50%, #64748b 100%);

    --green-grad: linear-gradient(135deg, #059669 0%, #10b981 50%, #34d399 100%);
    --red-grad: linear-gradient(135deg, #e11d48 0%, #f43f5e 50%, #fb7185 100%);

    --border: rgba(226, 232, 240, 0.25);
    --border-glow: rgba(226, 232, 240, 0.08);

    --green: #10b981;
    --red: #f43f5e;
    --text-light: #f8fafc;
    /* Podbity kontrast tekstu pomocniczego (WCAG AA na ciemnym tle) */
    --text-muted: #a8b7cb;

    --fs-mult: 1;

    /* Systemowy stack czcionek — zero zapytań sieciowych */
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  html, body {
    background: var(--bg);
    background-image: var(--bg-grad);
    color: var(--text-light);
    min-height: 100vh;
  }

  body {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  h1 {
    font-size: calc(24px * var(--fs-mult));
    letter-spacing: 1.5px;
    text-align: center;
    padding: 16px 0;
    font-weight: 900;
    background: linear-gradient(135deg, #ffffff 0%, var(--silver-light) 50%, var(--silver) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }

  h2 {
    font-size: calc(20px * var(--fs-mult));
    font-weight: 800;
    letter-spacing: 0.5px;
    color: var(--text-light);
  }

  .sub {
    font-size: calc(11px * var(--fs-mult));
    color: var(--silver);
    letter-spacing: 2px;
    margin: 20px 0 10px;
    font-weight: 700;
    text-transform: uppercase;
    text-align: center;
  }

  .card {
    position: relative;
    padding: 16px;
    margin-bottom: 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
    backdrop-filter: blur(16px);
    transition: border-color 0.2s;
  }

  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .row-left { display:flex; align-items:center; gap:12px; min-width:0; }

  .btn {
    display: block;
    width: 100%;
    border: 1px solid var(--silver);
    padding: 14px;
    font-size: calc(14px * var(--fs-mult));
    font-weight: 800;
    letter-spacing: 1.5px;
    background: var(--silver-grad);
    color: #070a12;
    cursor: pointer;
    transition: transform .1s, filter .15s, box-shadow .15s;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(226, 232, 240, 0.15);
    text-transform: uppercase;
  }
  .btn:active { transform: scale(.98); }
  .btn:disabled { background: #1e293b; border-color: #334155; color: #64748b; cursor: default; box-shadow: none; }

  .btn-main { padding: 11px; font-size: calc(12px * var(--fs-mult)); letter-spacing: 1px; }

  .btn-outline {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 38px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    color: var(--silver);
    font-weight: 700;
    padding: 0 14px;
    font-size: calc(13px * var(--fs-mult));
    letter-spacing: 0.5px;
    border-radius: 8px;
    cursor: pointer;
    transition: all .15s;
  }
  .btn-outline:hover { border-color: var(--silver); background: rgba(226, 232, 240, 0.1); }
  .btn-outline:active { transform: scale(.93); }
  .btn-outline:disabled { opacity:.35; pointer-events:none; }

  .btn-sm { width: auto; height: auto; padding: 8px 16px; font-size: calc(12px * var(--fs-mult)); }

  input[type=text], input[type=tel] {
    width: 100%;
    background: rgba(7, 10, 18, 0.8);
    border: 1px solid var(--border);
    color: #fff;
    padding: 12px;
    font-family: inherit;
    font-size: calc(15px * var(--fs-mult));
    outline: none;
    margin-top: 8px;
    border-radius: 8px;
    transition: border-color 0.2s;
  }
  input[type=text]:focus, input[type=tel]:focus { border-color: var(--silver); box-shadow: 0 0 10px rgba(226, 232, 240, 0.2); }

  .colors { display:flex; justify-content:space-between; gap:6px; margin-top:10px; }
  .dot { width:32px; height:32px; border:2px solid #070a12; border-radius:50%; cursor:pointer; flex-shrink:0; transition:transform .15s; padding:0; }
  .dot.sel { border-color:#fff; transform:scale(1.2); box-shadow: 0 0 12px var(--silver); }
  .dot.used { opacity:.2; pointer-events:none; }

  .avatar { width:16px; height:16px; border-radius:50%; flex-shrink:0; border: 1px solid rgba(255,255,255,0.2); }

  .list-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    padding: 12px 14px;
    margin-bottom: 8px;
    border-left: 4px solid var(--silver);
    border-radius: 8px;
  }
  .name { font-size: calc(15px * var(--fs-mult)); color: var(--text-light); font-weight: 600; }
  .scroll { flex:1; overflow-y:auto; margin-top:4px; }

  .score-num {
    font-size: clamp(40px, calc(56px * var(--fs-mult)), 84px);
    font-weight: 900;
    text-align: center;
    line-height: 1;
    background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    transition: transform .18s ease;
  }
  .score-num.bump { transform: scale(1.15); filter: drop-shadow(0 0 10px var(--silver)); }
  .pending { font-size: calc(22px * var(--fs-mult)); font-weight: 800; }

  .score-btns { display:flex; flex-wrap:nowrap; gap:6px; margin-top:14px; }
  .score-btns button {
    flex: 1 1 0;
    min-width: 0;
    padding: 10px 2px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-light);
    font-size: calc(var(--btn-fs, 14px) * var(--fs-mult));
    font-weight: 700;
    cursor: pointer;
    border-radius: 8px;
    transition: all .15s;
    white-space: nowrap;
    overflow: hidden;
  }
  .score-btns button:active { background: rgba(226, 232, 240, 0.2); border-color: var(--silver); }
  .score-btns button.amount-btn { border-style: dashed; border-color: var(--border-glow); background: rgba(255,255,255,0.02); color: var(--silver); }

  .confirm-row { display:flex; gap:10px; margin-top:12px; }
  .confirm-row button {
    flex:1;
    padding:12px 0;
    cursor:pointer;
    font-size:18px;
    font-weight:900;
    border-radius:8px;
    transition: all .15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .confirm-row button.btn-cancel {
    background: var(--red-grad);
    color: #ffffff;
    border: 1px solid rgba(244, 63, 94, 0.8);
    box-shadow: 0 4px 15px rgba(244, 63, 94, 0.25);
  }
  .confirm-row button.btn-apply {
    background: var(--green-grad);
    color: #070a12;
    border: 1px solid rgba(16, 185, 129, 0.8);
    box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25);
  }
  .confirm-row button:active { transform: scale(.96); filter: brightness(1.1); }
  .confirm-row button.off { opacity:.3; box-shadow:none; }

  .history-chips { display:flex; flex-direction:column; gap:6px; width:56px; flex-shrink:0; margin:0; }
  .history-chips .chip {
    flex:0 0 auto;
    height:calc(32px * var(--fs-mult));
    padding:2px;
    border-radius:8px;
    border:1px solid var(--border);
    background:rgba(255,255,255,0.03);
    font-weight:800;
    font-size: calc(13px * var(--fs-mult));
    text-align:center;
    cursor:pointer;
    transition: all .15s;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .history-chips .chip:hover { border-color: var(--silver); background: rgba(226,232,240,0.08); }
  .history-chips .chip:active { transform: scale(.94); }
  .history-chips .chip.empty { opacity:.25; pointer-events:none; font-weight:600; color:var(--text-muted); }

  .dialog-back { position:fixed; inset:0; background:rgba(7, 10, 18, 0.85); backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .dialog { background:var(--card-inner); border:1px solid var(--silver); padding:24px; width:100%; max-width:340px; margin:0 auto; animation:dialogIn .18s ease-out; box-shadow:0 20px 50px rgba(0,0,0,0.9), 0 0 30px rgba(226,232,240,0.1); border-radius:12px; max-height: calc(100vh - 40px); overflow-y:auto; }
  .dialog h3 { font-size: calc(20px * var(--fs-mult)); margin-bottom:12px; color:var(--text-light); text-align:center; border-bottom:1px solid var(--border); padding-bottom:8px; font-weight:800; }
  .dialog-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  .dialog-actions.stack { flex-direction:column; align-items:stretch; }
  .dialog-actions.stack .dlg-btn { width:100%; }

  .empty { text-align:center; color:var(--text-muted); font-size: calc(14px * var(--fs-mult)); padding:36px 12px; line-height:1.6; font-style:italic; }
  .header-row { display:flex; align-items:center; gap:4px; margin-bottom:16px; flex-wrap:wrap; row-gap:8px; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1e293b; border:1px solid var(--silver); color:#fff; font-size: calc(12px * var(--fs-mult)); font-weight:600; padding:10px 20px; z-index:99; animation:toastIn .22s ease-out; box-shadow:0 10px 25px rgba(0,0,0,0.8); border-radius:30px; letter-spacing:0.5px; max-width: 90vw; text-align:center; }
  .tiny { font-size: calc(11px * var(--fs-mult)); color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:1px; }
  .mt { margin-top:12px; }
  .winner { font-size: calc(32px * var(--fs-mult)); font-weight:900; background:linear-gradient(135deg, #fff 0%, var(--silver) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-align:center; padding:8px 0; }

  .dlg-btn { flex:1; padding:12px 0; font-size: calc(13px * var(--fs-mult)); font-weight:800; cursor:pointer; border:1px solid var(--border); border-radius:8px; transition:transform .05s; text-transform:uppercase; letter-spacing:0.5px; background:transparent; color:var(--text-light); }
  .dlg-btn:active { transform:scale(.98); }
  .dlg-btn.secondary { background:transparent; color:var(--text-light); }
  .dlg-btn.green { background:var(--green-grad); color:#070a12; border-color:var(--green); box-shadow:0 4px 15px rgba(16, 185, 129, 0.2); }
  .dlg-btn.red { background:var(--red-grad); color:#fff; border-color:var(--red); box-shadow:0 4px 15px rgba(244, 63, 94, 0.2); }
  .dlg-btn.neutral { background:#334155; color:#fff; border-color:#475569; }
  .dlg-btn.solid { background:var(--silver-grad); color:#070a12; border-color:var(--silver); box-shadow:0 4px 15px rgba(226, 232, 240, 0.15); }

  .lang-btn { flex:1; height:44px; background:rgba(255,255,255,0.03); border:1px solid var(--border); color:var(--silver); font-weight:800; font-size:calc(13px * var(--fs-mult)); letter-spacing:1px; border-radius:8px; cursor:pointer; transition:all .15s; }
  .lang-btn.sel { background:var(--silver-grad); color:#070a12; border-color:var(--silver); box-shadow:0 4px 15px rgba(226, 232, 240, 0.15); }
  .lang-btn:active { transform:scale(.97); }

  .rank-list { margin-top:14px; display:flex; flex-direction:column; gap:8px; }
  .rank-row { display:flex; align-items:center; gap:12px; border:1px solid var(--border); padding:10px 14px; background:rgba(255,255,255,0.02); border-radius:8px; }
  .rank-row.first { border-color:var(--silver); background:rgba(226, 232, 240, 0.1); box-shadow:0 0 15px rgba(226, 232, 240, 0.15); }
  .rank-pos { width:28px; height:28px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:#1e293b; color:var(--silver); font-weight:800; font-size:12px; border-radius:50%; border:1px solid var(--border); }
  .rank-row.first .rank-pos { color:#070a12; background:var(--silver); border-color:var(--silver); }
  .rank-name { flex:1; display:flex; align-items:center; gap:10px; font-size: calc(15px * var(--fs-mult)); color:var(--text-light); min-width:0; font-weight:600; }
  .rank-name .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rank-score { flex-shrink:0; min-width:48px; text-align:right; font-size: calc(22px * var(--fs-mult)); font-weight:800; color:var(--text-light); }

  .icon-btn { display:flex; align-items:center; justify-content:center; width:38px; height:38px; background:rgba(255, 255, 255, 0.03); border:1px solid var(--border); border-radius:8px; cursor:pointer; flex-shrink:0; padding:0; transition:all .15s; }
  .icon-btn:hover { border-color:var(--silver); background:rgba(226, 232, 240, 0.1); }
  .icon-btn:active { transform:scale(.93); }
  .icon-btn svg { width:18px; height:18px; display:block; }
  .icon-btn:disabled { opacity:.2; pointer-events:none; }
  .icon-btn.gear { width:46px; height:46px; }
  .icon-btn.gear svg { width:20px; height:20px; }

  /* WIDOCZNY FOCUS DLA NAWIGACJI KLAWIATURĄ (dostępność) */
  :focus-visible { outline: 2px solid var(--silver-light); outline-offset: 2px; }
  .dot:focus-visible, .chip:focus-visible { outline-offset: 1px; }

  @keyframes dialogIn{
    from{ opacity:0; transform:scale(.95); }
    to{ opacity:1; transform:scale(1); }
  }

  @keyframes toastIn{
    from{ opacity:0; transform:translate(-50%,10px); }
    to{ opacity:1; transform:translate(-50%,0); }
  }
</style>
</head>

   - wersjonowanie schematu + migracja starych danych
   - kopia zapasowa kluczy (.bak) przed nadpisaniem
   - kwarantanna uszkodzonych danych (.corrupt) i odzyskiwanie
   ================================================================ */
const C = { green:"#10b981", red:"#f43f5e", silver:"#e2e8f0" };
const PLAYER_COLORS = ["#e2e8f0","#38bdf8","#34d399","#f43f5e","#fb923c","#a78bfa","#f472b6","#facc15"];

const SCHEMA_VERSION = 2;

/* Limity bezpieczeństwa (import + zapisy lokalne) */

  importBytes: 2 * 1024 * 1024, // 2 MB
  groups: 50,
  saves: 50,
  players: PLAYER_COLORS.length, // 8
  name: 20,
  saveName: 40,
  history: 500,
  scoreAbs: 999999
};

const LS_KEY = "licznik_punktow_v1";
const LS_SETTINGS_KEY = "licznik_punktow_settings_v1";
const LS_SAVES_KEY = "licznik_punktow_saves_v1";

const STORE = { recovered: false, recoveredFromBak: false };

function lsAvailable() {
  try { const k = "__licznik_probe__"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return true; }
  catch (e) { return false; }
}

/* Odczyt z automatyczną migracją starych (surowych) danych i kwarantanną uszkodzonych */
function readStore(key) {
  let raw = null;
  try { raw = localStorage.getItem(key); } catch (e) { return null; }
  if (raw === null) {
    /* próba odzyskania z kopii .bak (np. gdy zapis zakończył się awaryjnie) */
    let bak = null;
    try { bak = localStorage.getItem(key + ".bak"); } catch (e) {}
    if (bak !== null) {
      const d = tryParseEnvelope(bak, key);
      if (d !== null) { STORE.recovered = true; STORE.recoveredFromBak = true; return d; }
    }
    return null;
  }
  const parsed = tryParseEnvelope(raw, key);
  if (parsed === undefined) return null; // kwarantanna — dane uszkodzone
  return parsed;
}

function tryParseEnvelope(raw, key) {
  let obj;
  try { obj = JSON.parse(raw); } catch (e) { quarantine(key, raw); return undefined; }
  if (obj && typeof obj === "object" && obj.__v === SCHEMA_VERSION) return obj.d; // aktualny format
  /* starszy format: surowy ładunek — migrujemy do koperty */
  try {
    localStorage.setItem(key, JSON.stringify({ __v: SCHEMA_VERSION, d: obj }));
    try { localStorage.setItem(key + ".bak", raw); } catch (e2) {}
  } catch (e) {}
  return obj; // zwracamy dane (mogą być null przy pierwszym uruchomieniu)
}

function quarantine(key, raw) {
  try { localStorage.setItem(key + ".corrupt", raw); } catch (e) {}
  try { localStorage.removeItem(key); } catch (e) {}
  STORE.recovered = true;
}

/* Zapis z kopią zapasową poprzedniej wersji; zwraca false przy błędzie (np. quota) */
function writeStore(key, data) {
  const payload = JSON.stringify({ __v: SCHEMA_VERSION, d: data });
  try {
    const old = localStorage.getItem(key);
    if (old !== null) { try { localStorage.setItem(key + ".bak", old); } catch (e2) {} }
    localStorage.setItem(key, payload);
    return true;
  } catch (e) {
    toast(t("errSave"));
    return false;
  }
}

function detectLang() {
  try {
    const l = (navigator.language || navigator.userLanguage || "pl").toLowerCase();
    return l.indexOf("pl") === 0 ? "pl" : "en";
  } catch (e) { return "pl"; }
}
function t(key) {
  const lang = (S && S.settings && S.settings.lang) || "pl";
  const dict = STR[lang] || STR.pl;
  return dict[key] !== undefined ? dict[key] : (STR.pl[key] !== undefined ? STR.pl[key] : key);
}
function locale() { return (S.settings.lang === "en") ? "en-GB" : "pl-PL"; }

/* Walidacja ustawień (używana przy ładowaniu i imporcie) */
function sanitizeSettings(d, fallbackLang) {
  if (!d || typeof d !== "object") {
    return { fontScale: 1, buttonValues: [1, 10], lang: fallbackLang || detectLang() };
  }
  const fs = typeof d.fontScale === "number" && Number.isFinite(d.fontScale) ? d.fontScale : 1;
  let bv = [1, 10];
  if (Array.isArray(d.buttonValues)) {
    const clean = [];
    for (const v of d.buttonValues) {
      const n = Math.trunc(Number(v));
      if (Number.isFinite(n) && n > 0 && n <= 9999 && !clean.includes(n)) clean.push(n);
      if (clean.length >= MAX_BUTTON_PAIRS) break;
    }
    if (clean.length) bv = clean;
  }
  const lang = (d.lang === "pl" || d.lang === "en") ? d.lang : (fallbackLang || detectLang());
  return { fontScale: Math.max(0.8, Math.min(1.6, fs)), buttonValues: bv, lang: lang };
}

let idCounter = 0; // licznik dla ostatecznego fallbacku newId()
/* pomocniczy atrybut data-p: argumenty akcji w JSON, zakodowane jako URI
   (brak cudzysłowów i znaków specjalnych w wartości atrybutu HTML) */
const jp = arr => encodeURIComponent(JSON.stringify(arr));

function newId() {
  /* 1) natywny UUID v4 */
  try { if (crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
  /* 2) konstrukcja v4 z crypto.getRandomValues (HTTP/HTTPS bez secure context) */
  try {
    if (crypto && crypto.getRandomValues) {
      const b = crypto.getRandomValues(new Uint8Array(16));
      b[6] = (b[6] & 0x0f) | 0x40;
      b[8] = (b[8] & 0x3f) | 0x80;
      const hex = Array.prototype.map.call(b, x => x.toString(16).padStart(2, "0")).join("");
      return hex.slice(0,8)+"-"+hex.slice(8,12)+"-"+hex.slice(12,16)+"-"+hex.slice(16,20)+"-"+hex.slice(20);
    }
  } catch (e) {}
  /* 3) ostateczny fallback: czas + losowość */
  return Date.now()+"-"+Math.random().toString(36).slice(2)+"-"+(idCounter++);
}

/* ================================================================
   5. LOGIC — CZYSTY MODEL DANYCH (bez DOM, testowalny)
   ================================================================ */
const Logic = {
  /* Walidacja liczby punktów: zwraca dodatnią liczbę całkowitą albo null.
     Ujednolica obsługę pustych, zerowych, ujemnych i niecałkowitych wartości. */
  parsePoints(v) {
    if (v === null || v === undefined) return null;
    const s = String(v).trim();
    if (!/^\d+$/.test(s)) return null; // tylko cyfry; "" i "-5" odrzucone
    const n = parseInt(s, 10);
    if (!Number.isFinite(n) || n <= 0 || n > LIMITS.scoreAbs) return null;
    return n;
  },
  findPlayer(st, id) { return st.players.find(x => String(x.id) === String(id)) || null; },
  /* Zatwierdzenie punktów: score + delta, wpis do historii. Idempotentne wobec delta=0. */
  applyPoints(st, id, delta) {
    delta = Math.trunc(Number(delta));
    if (!delta || Math.abs(delta) > LIMITS.scoreAbs) return false;
    const p = Logic.findPlayer(st, id);
    if (!p) return false;
    p.score = Math.trunc(Number(p.score) || 0) + delta;
    st.history.push({ hid: newId(), id: String(p.id), delta: delta });
    if (st.history.length > LIMITS.history) st.history.shift();
    return true;
  },
  /* Cofnięcie ostatniego wpisu */
  undo(st) {
    if (!st.history.length) return false;
    const move = st.history.pop();
    const p = Logic.findPlayer(st, move.id);
    if (p) p.score -= move.delta;
    return true;
  },
  /* Edycja istniejącego wpisu (również zmiana znaku) */
  editEntry(st, hid, num) {
    const h = st.history.find(x => x.hid === hid);
    if (!h || !num) return false;
    const p = Logic.findPlayer(st, h.id);
    if (p) p.score += (num - h.delta);
    h.delta = num;
    return true;
  },
  /* Usunięcie wpisu i korekta wyniku */
  deleteEntry(st, hid) {
    const i = st.history.findIndex(x => x.hid === hid);
    if (i < 0) return false;
    const h = st.history[i];
    const p = Logic.findPlayer(st, h.id);
    if (p) p.score -= h.delta;
    st.history.splice(i, 1);
    return true;
  },
  signature(players) { return players.map(p => p.name + "|" + p.color).sort().join(";"); }
};

/* --- Walidacja danych importu (głęboka sanityzacja) --- */
function sanitizeColor(c) { return PLAYER_COLORS.indexOf(c) >= 0 ? c : PLAYER_COLORS[0]; }

function sanitizePlayers(raw) {
  if (!Array.isArray(raw) || raw.length === 0 || raw.length > LIMITS.players) return null;
  const out = [];
  const used = new Set();
  for (let i = 0; i < raw.length; i++) {
    const p = raw[i];
    if (!p || typeof p !== "object") return null;
    const name = (typeof p.name === "string" ? p.name.trim() : "").slice(0, LIMITS.name);
    if (!name) return null;
    let color = sanitizeColor(p.color);
    if (used.has(color)) {
      const free = PLAYER_COLORS.find(c => !used.has(c));
      if (!free) return null;
      color = free;
    }
    used.add(color);
    const score = Number(p.score);
    out.push({ id: String(i), name: name, color: color, score: Number.isFinite(score) ? Math.trunc(score) : 0 });
  }
  return out;
}

function sanitizeGroups(raw) {
  if (!Array.isArray(raw)) return [];
  const out = [];
  for (const g of raw) {
    if (out.length >= LIMITS.groups) break;
    if (!g || typeof g !== "object") continue; // pomijamy uszkodzone wpisy
    const players = sanitizePlayers(g.players);
    if (players) out.push({ id: newId(), players: players });
  }
  return out;
}

function sanitizeSaves(raw) {
  if (!Array.isArray(raw)) return [];
  const out = [];
  for (const s of raw) {
    if (out.length >= LIMITS.saves) break;
    if (!s || typeof s !== "object") continue;
    const players = sanitizePlayers(s.players);
    if (!players) continue;
    /* mapa starych id graczy -> nowe id (indeksy) */
    const idMap = {};
    s.players.forEach((p, i) => { if (p && typeof p === "object" && p.id !== undefined) idMap[String(p.id)] = String(i); });
    const history = [];
    let okHist = true;
    if (Array.isArray(s.history)) {
      if (s.history.length > LIMITS.history) continue;
      for (const h of s.history) {
        if (!h || typeof h !== "object" || idMap[String(h.id)] === undefined) { okHist = false; break; }
        const delta = Math.trunc(Number(h.delta));
        if (!Number.isFinite(delta) || delta === 0) { okHist = false; break; }
        const hid = (typeof h.hid === "string" && h.hid) ? h.hid.slice(0, 64) : newId();
        history.push({ hid: hid, id: idMap[String(h.id)], delta: delta });
      }
    }
    if (!okHist) continue;
    const name = (typeof s.name === "string" ? s.name.trim() : "").slice(0, LIMITS.saveName) || (STR.pl.saveWord + " " + new Date().toLocaleDateString());
    out.push({
      id: newId(), name: name,
      savedAt: Number.isFinite(Number(s.savedAt)) ? Number(s.savedAt) : Date.now(),
      players: players, history: history,
      nextId: Number.isFinite(Number(s.nextId)) ? Math.trunc(Number(s.nextId)) : players.length
    });
  }
  return out;
}

/* Pełna walidacja importu: zwraca {groups, saves, settings} albo null */
function validateImport(data) {
  if (!data || typeof data !== "object" || Array.isArray(data)) return null;
  const hasPayload = Array.isArray(data.groups) || Array.isArray(data.saves) || data.settings;
  if (!hasPayload) return null;
  const groups = sanitizeGroups(data.groups);
  const saves = sanitizeSaves(data.saves);
  if ((Array.isArray(data.groups) && data.groups.length && !groups.length) &&
      (Array.isArray(data.saves) && data.saves.length && !saves.length)) return null;
  const settings = data.settings ? sanitizeSettings(data.settings, S.settings.lang) : null;
  return { groups: groups, saves: saves, settings: settings };
}

/* ================================================================
   5b. TESTY AUTOMATYCZNE (Logic + walidacja) — przycisk w Ustawieniach
       lub dopisanie ?test do adresu. Wynik: konsola + toast.
   ================================================================ */
function runSelfTests() {
  const results = [];
  function check(name, cond) { results.push({ name: name, ok: !!cond }); }
  const st = () => ({ players: [{ id: "0", name: "A", color: "#e2e8f0", score: 0 },
                                { id: "1", name: "B", color: "#38bdf8", score: 10 }],
                     history: [] });

  // punktacja
  let s = st();
  check("apply +10", Logic.applyPoints(s, "0", 10) && s.players[0].score === 10);
  check("apply -3", Logic.applyPoints(s, "1", -3) && s.players[1].score === 7);
  check("apply 0 odrzucone", Logic.applyPoints(s, "0", 0) === false);
  check("apply dla nieistniejącego gracza odrzucone", Logic.applyPoints(s, "99", 5) === false);
  check("wpis w historii", s.history.length === 2 && s.history[1].delta === -3);

  // cofanie
  check("undo koryguje wynik", Logic.undo(s) && s.players[1].score === 10);
  check("undo usuwa wpis", s.history.length === 1);
  s.history = [];
  check("undo pustej historii odrzucone", Logic.undo(s) === false);

  // edycja
  s = st();
  Logic.applyPoints(s, "0", 5);
  const hid = s.history[0].hid;
  check("edycja zmienia wynik", Logic.editEntry(s, hid, 12) && s.players[0].score === 12);
  check("edycja zmienia znak", Logic.editEntry(s, hid, -4) && s.players[0].score === -4);
  check("edycja nieistniejącego wpisu odrzucona", Logic.editEntry(s, "brak", 5) === false);

  // usuwanie
  check("usuwanie wpisu koryguje wynik", Logic.deleteEntry(s, hid) && s.players[0].score === 0 && s.history.length === 0);
  check("usuwanie nieistniejącego odrzucone", Logic.deleteEntry(s, hid) === false);

  // parsowanie liczb (puste / zero / ujemne / przecinki / zbyt duże)
  check("parse 25", Logic.parsePoints("25") === 25);
  check("parse puste odrzucone", Logic.parsePoints("") === null);
  check("parse 0 odrzucone", Logic.parsePoints("0") === null);
  check("parse -5 odrzucone", Logic.parsePoints("-5") === null);
  check("parse 3.7 odrzucone", Logic.parsePoints("3.7") === null);
  check("parse abc odrzucone", Logic.parsePoints("abc") === null);
  check("parse limit 999999", Logic.parsePoints("999999") === 999999);
  check("parse nad limit odrzucone", Logic.parsePoints("1000000") === null);

  // walidacja importu
  check("import poprawny", !!validateImport({ groups: [{ players: [{ name: "A", color: "#e2e8f0" }] }], saves: [] }));
  check("import null odrzucony", validateImport(null) === null);
  check("import tablicy odrzucony", validateImport([1,2,3]) === null);
  check("import bez danych odrzucony", validateImport({ foo: 1 }) === null);
  check("import złośliwych graczy odrzucony", sanitizePlayers([{ name: "", color: "#fff" }]) === null);
  check("import >8 graczy odrzucony", sanitizePlayers(new Array(9).fill({ name: "X", color: "#e2e8f0" })) === null);
  check("import złej historii pominięty", sanitizeSaves([{ players: [{ name: "A", color: "#e2e8f0" }], history: [{ id: "0", delta: 0 }] }]).length === 0);

  const passed = results.filter(r => r.ok).length;
  const total = results.length;
  if (typeof console !== "undefined") {
    results.forEach(r => { (r.ok ? console.log : console.error)("[" + (r.ok ? "OK " : "FAIL") + "] " + r.name); });
  }
  return { passed: passed, total: total, results: results };
}

function scoreButtonsHtml(id) {
  const vals = (S.settings.buttonValues || [1,10]).slice().sort((a,b)=>a-b);
  let btns = '<button class="amount-btn" aria-label="'+t("subtractPoints")+'" data-a="openCustomAmount" data-p="'+jp([id,-1])+'">\u2212\u2026</button>';
  vals.slice().reverse().forEach(function(v){ btns += '<button aria-label="\u2212'+v+'" data-a="pend" data-p="'+jp([id,-v])+'">\u2212'+v+'</button>'; });
  vals.forEach(function(v){ btns += '<button aria-label="+'+v+'" data-a="pend" data-p="'+jp([id,v])+'">+'+v+'</button>'; });
  btns += '<button class="amount-btn" aria-label="'+t("addPoints")+'" data-a="openCustomAmount" data-p="'+jp([id,1])+'">+\u2026</button>';

  if (count > 10) fs = 10;
  return '<div class="score-btns" style="--btn-fs:'+fs+'px">'+btns+'</div>';

/* Karta pojedynczego gracza (osobna funkcja — używana też przez render cząstkowy) */
function playerCardHtml(p) {
  const pend = S.pending[p.id] || 0;
  const entries = S.history.filter(h => String(h.id) === String(p.id)).slice(-3).reverse();
  const chips = [0,1,2].map(i => {
    const h = entries[i];
    if (!h) return '<span class="chip empty" aria-hidden="true">—</span>';
    const sign = h.delta > 0 ? "+" : "";
    return '<button class="chip" style="color:'+(h.delta>0?C.green:C.red)+'" aria-label="'+t("editEntryTitle")+': '+sign+h.delta+'" data-a="openEditHistory" data-p="'+jp([h.hid])+'">'+sign+h.delta+'</button>';
  }).join("");

  return '<div class="card" data-card="'+esc(p.id)+'" style="border-left:4px solid '+esc(p.color)+'">' +
    '<span class="row-left"><span class="avatar" style="background:'+esc(p.color)+'"></span>' +
    '<span class="name" style="font-weight:700;font-size:calc(18px * var(--fs-mult))">'+esc(p.name)+'</span></span>' +
    '<div class="row" style="align-items:center;gap:8px;margin-top:8px">' +
      '<div style="flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px">' +
        '<span class="score-num'+(S.animScore===p.id?' bump':'')+'" aria-live="polite">'+p.score+'</span>' +
        (pend ? '<span class="pending" style="color:'+(pend>0?C.green:C.red)+'">'+(pend>0?"+"+pend:pend)+'</span>' : "") +
      '</div>' +
      '<div class="history-chips">'+chips+'</div>' +
    '</div>' +
    scoreButtonsHtml(p.id) +
    (pend ?
    '<div class="confirm-row">' +
      '<button class="btn-cancel" aria-label="'+t("cancelShort")+'" data-a="pendCancel" data-p="'+jp([p.id])+'">✕</button>' +
      '<button class="btn-apply" aria-label="OK" data-a="pendApply" data-p="'+jp([p.id])+'">✓</button>' +
    '</div>' : "") +
  '</div>';
}

        '<button class="dlg-btn secondary" data-a="closeDialog">'+t("cancelShort")+'</button>' +
      '</div>';
  }
  else if (d.type === "confirmLoadSave") {
    inner = '<h3>'+t("loadSaveQ")+'</h3>' +
      (d.warn ? '<p class="tiny" style="text-align:center;margin-top:8px;text-transform:none;letter-spacing:0">'+t("loadWarn")+'</p>' : '') +
      '<div class="dialog-actions" style="margin-top:16px">' +
        '<button class="dlg-btn secondary" data-a="closeDialog">'+t("cancelShort")+'</button>' +
        '<button class="dlg-btn solid" data-a="doLoadSave" data-p="'+jp([d.id])+'">'+t("load")+'</button>' +
      '</div>';
  }
  else if (d.type === "confirmDeleteSave") {
    inner = '<h3>'+t("deleteSaveQ")+'</h3>' +
      '<p style="margin-top:8px;color:var(--text-light);text-align:center">'+esc(d.name)+'</p>' +
      '<div class="dialog-actions">' +
        '<button class="dlg-btn secondary" data-a="closeDialog">'+t("cancelShort")+'</button>' +
        '<button class="dlg-btn red" data-a="confirmDeleteSaveFn" data-p="'+jp([d.id])+'">'+t("remove")+'</button>' +
      '</div>';
  }
  else if (d.type === "confirmImport") {
    inner = '<h3>'+t("importQ")+'</h3>' +
      '<p class="tiny" style="text-align:center;margin-top:8px;text-transform:none;letter-spacing:0;line-height:1.6">'+t("importFoundPrefix")+d.groupsCount+' '+t("lineupsWord")+', '+d.savesCount+' '+t("savesWord")+'.<br>'+t("importWarn")+'</p>' +
      '<div class="dialog-actions" style="margin-top:16px">' +
        '<button class="dlg-btn secondary" data-a="cancelImport">'+t("cancelShort")+'</button>' +
        '<button class="dlg-btn solid" data-a="confirmImportData">'+t("importBtn")+'</button>' +
      '</div>';
  }

  return '<div class="dialog-back"' + (noBack?"":' data-a="dialogBackdrop"') + '>' +
    '<div class="dialog" role="dialog" aria-modal="true"' + (noBack?"":' data-a="dialogStop"') + '>'+inner+'</div></div>';
}

/* ================================================================
   8. AKCJE (model), DELEGACJA ZDARZEŃ, DOSTĘPNOŚĆ, INICJALIZACJA
   ================================================================ */
/* Aktualizacja nakładek (dialog + toast) bez przebudowy widoku głównego */
function updateOverlay() {
  const dlgEl = app.querySelector(".dialog-back");
  if (S.dialog) {
    if (dlgEl) dlgEl.remove();
    app.insertAdjacentHTML("beforeend", dialogHtml());
    const dlg = app.querySelector(".dialog");
    if (dlg) {
      const first = dlg.querySelector("input") || dlg.querySelector("button");
      if (first) first.focus();
      if (first && first.id === "saveGameName" && typeof first.select === "function") first.select();
    }
  } else if (dlgEl) dlgEl.remove();

  const toastEl = app.querySelector(".toast");
  if (S.toast) {
    if (toastEl) toastEl.remove();
    app.insertAdjacentHTML("beforeend", '<div class="toast" role="status" aria-live="polite">'+esc(S.toast)+'</div>');
  } else if (toastEl) toastEl.remove();
}

/* RENDER CZĄSTKOWY (ekran gry): bez migotania, przebudowywane są TYLKO
   karty graczy, których HTML faktycznie się zmienił (keyed diff po data-card).
   Delegacja zdarzeń działa bez zmian, bo nasłuch jest na dokumencie. */
function partialRenderGame() {
  const undoBtn = app.querySelector('[data-a="undo"]');
  if (undoBtn) undoBtn.disabled = !S.history.length;

  const scroll = app.querySelector(".scroll");
  if (scroll) {
    const cards = S.players.map(playerCardHtml);
    const existing = Array.prototype.slice.call(scroll.querySelectorAll("[data-card]"));
    if (existing.length === S.players.length && existing.length > 0 && S.cardCache) {
      S.players.forEach(function(p, i) {
        const html = cards[i];
        if (S.cardCache[p.id] !== html) {
          const tmp = document.createElement("div");
          tmp.innerHTML = html;
          scroll.replaceChild(tmp.firstElementChild, existing[i]);
        }
      });
    } else {
      scroll.innerHTML = cards.join("");
    }
    S.cardCache = {};
    S.players.forEach(function(p, i) { S.cardCache[p.id] = cards[i]; });
  }
  updateOverlay();
}

function render() {
  /* jeśli zostajemy na ekranie gry — aktualizujemy tylko to, co się zmieniło */
  if (S.screen === "game" && S.lastScreen === "game" && app.dataset.screen === "game" && app.querySelector(".scroll")) {
    partialRenderGame();
    return;
  }

  S.lastScreen = S.screen;
  app.dataset.screen = S.screen;

  const activeEl = document.activeElement;
  const activeId = activeEl && activeEl.id ? activeEl.id : null;

  let html = "";
  if (S.screen === "home") html = viewHome();
  else if (S.screen === "setup") html = viewSetup();
  else if (S.screen === "settings") html = viewSettings();
  else html = viewGame();

  html += dialogHtml();
  if (S.toast) html += '<div class="toast" role="status" aria-live="polite">'+esc(S.toast)+'</div>';
  app.innerHTML = html;

  /* cache kart dla przyszłych renderów cząstkowych */
  if (S.screen === "game") {
    S.cardCache = {};
    S.players.forEach(function(p) { S.cardCache[p.id] = playerCardHtml(p); });
  }

  /* Przywrócenie fokusu aktywnego pola (np. podczas pisania) */
  if (activeId) {
    const el = document.getElementById(activeId);
    if (el && typeof el.focus === "function") {
      el.focus();
      if (typeof el.selectionStart === "number") {
        const pos = el.value ? el.value.length : 0;
        el.selectionStart = el.selectionEnd = pos;
      }
    }
  } else if (S.dialog) {
    /* Fokus startowy w dialogu: pierwsze pole, inaczej pierwszy przycisk */
    const dlg = document.querySelector(".dialog");
    if (dlg) {
      const first = dlg.querySelector("input") || dlg.querySelector("button");
      if (first) first.focus();
      if (first && first.id === "saveGameName" && typeof first.select === "function") first.select();
    }
  }
}

function closeDialog() {
  S.editDraft = null;
  S.dialog = null;
  render();
  restoreFocus();
}
function restoreFocus() {
  if (S.lastFocus && document.contains(S.lastFocus) && typeof S.lastFocus.focus === "function") {
    S.lastFocus.focus();
  }
  S.lastFocus = null;
}
function setScreen(s) { S.dialog = null; S.editDraft = null; S.screen = s; render(); window.scrollTo(0,0); }
function openDialogFn(d) {
  if (!document.querySelector(".dialog-back")) S.lastFocus = document.activeElement;
  S.dialog = d;
  render();
}

function usedColors(exceptId) {
  return S.players.filter(p => String(p.id) !== String(exceptId)).map(p => p.color);
}

function addGroupIfNew(players) {
  const sig = Logic.signature(players);
  if (players.length && !S.groups.some(g => Logic.signature(g.players) === sig)) {
    S.groups.push({ id: newId(), players: players.map(p => ({name:p.name, color:p.color})) });
    saveGroups(S.groups);
  }
}

function startGame(players) {
  S.players = players.map((p,i) => ({ id:String(i), name:p.name, color:p.color, score:0 }));
  S.nextId = players.length;
  S.pending = {};
  S.history = [];
  S.busy = false;
  S.cardCache = null; // nowa gra = nowy zestaw kart
  S.dialog = { type:"drawAsk" };
  S.screen = "game";
  render(); window.scrollTo(0,0);
}

/* --- Akcje UI --- */
const ACTIONS = {
  /* nawigacja */
  newGame() { S.players = []; S.setupName = ""; S.setupColor = null; S.nextId = 1; setScreen("setup"); },
  openSettings() { setScreen("settings"); },
  backHome() { setScreen("home"); },
  dialogBackdrop(el, e) { if (e.target === el) closeDialog(); },
  dialogStop(el, e) { e.stopPropagation(); },
  closeDialog() { closeDialog(); },

  /* skład / gracze */
  askRemoveGroup(id) {
    const g = S.groups.find(x => x.id === id); if (!g) return;
    openDialogFn({ type:"confirmDeleteGroup", id:id, label:g.players.map(p=>p.name).join(" • ") });
  },
  confirmDeleteGroup(id) {
    S.groups = S.groups.filter(g => g.id !== id);
    saveGroups(S.groups);
    closeDialog();
  },
  playGroup(id) {
    const g = S.groups.find(x => x.id === id); if (!g) return;
    startGame(g.players);
  },
  pickColor(c) {
    S.setupColor = c;
    render();
    const inp = document.getElementById("nameInput");
    if (inp) inp.focus();
  },
  addSetupPlayer() {
    const name = (S.setupName||"").trim().slice(0, LIMITS.name);
    const used = usedColors();
    const color = S.setupColor || PLAYER_COLORS.find(c => used.indexOf(c)<0);
    if (!name || !color || used.indexOf(color)>=0) return;
    S.players.push({ id:String(S.nextId++), name:name, color:color, score:0 });
    S.setupName = ""; S.setupColor = null;
    render();
    const inp = document.getElementById("nameInput");
    if (inp) inp.focus();
  },
  removeSetupPlayer(id) { S.players = S.players.filter(p => String(p.id)!==String(id)); render(); },
  startFromSetup() {
    if (!S.players.length) return;
    addGroupIfNew(S.players);
    startGame(S.players.map(p => ({name:p.name, color:p.color})));
  },

  /* punktacja */
  pend(id, d) { id = String(id); S.pending[id] = (S.pending[id]||0) + d; render(); },
  pendCancel(id) { delete S.pending[String(id)]; render(); },
  pendApply(id) {
    id = String(id);
    const d = S.pending[id] || 0;
    if (!d) return; // blokada wielokrotnego zatwierdzenia / pustej operacji
    if (S.busy) return;
    S.busy = true;
    Logic.applyPoints(S, id, d);
    delete S.pending[id];
    S.animScore = id;
    if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} }
    render();
    setTimeout(() => { S.animScore = null; S.busy = false; render(); }, 180);
  },
  undo() { Logic.undo(S); render(); },
  openCustomAmount(id, sign) { openDialogFn({ type:"customAmount", id:String(id), sign:sign, value:"" }); },
  confirmCustomAmount() {
    const d = S.dialog;
    if (!d || d.type !== "customAmount" || S.busy) return;
    const n = Logic.parsePoints(d.value);
    if (!n) { toast(t("numPositive")); return; }
    S.busy = true;
    S.pending[d.id] = (S.pending[d.id] || 0) + d.sign * n;
    S.dialog = null; S.busy = false;
    render();
  },
  openEditHistory(hid) {
    const h = S.history.find(x => x.hid === hid);
    if (!h) return;
    openDialogFn({ type:"editHistory", hid:hid, value:String(Math.abs(h.delta)), sign: h.delta < 0 ? -1 : 1 });
  },
  setHistorySign(sign) { if (S.dialog && S.dialog.type === "editHistory") { S.dialog.sign = sign; render(); } },
  saveHistoryEdit() {
    const d = S.dialog;
    if (!d || d.type !== "editHistory" || S.busy) return;
    const n = Logic.parsePoints(d.value);
    if (!n) { toast(t("numPositive")); return; }
    S.busy = true;
    Logic.editEntry(S, d.hid, d.sign * n);
    S.dialog = null; S.busy = false;
    render();
    restoreFocus();
  },
  deleteHistoryEntry(hid) {
    if (S.busy) return;
    S.busy = true;
    Logic.deleteEntry(S, hid);
    S.dialog = null; S.busy = false;
    render();
    restoreFocus();
  },

  /* edycja składu w grze */
  openEdit() { openDialogFn({ type:"edit" }); },
  openEditPlayer(id) { S.editDraft = null; openDialogFn({ type:"editPlayer", id:String(id) }); },
  cancelEditPlayer() { S.editDraft = null; S.dialog = { type:"edit" }; render(); },
  backToEditList() { S.dialog = S.players.length ? { type:"edit" } : null; render(); },
  askRemovePlayer(id) {
    const p = S.players.find(x => String(x.id) === String(id));
    if (!p) return;
    openDialogFn({ type:"confirmDelete", id:String(id), name:p.name });
  },
  confirmDeletePlayer(id) {
    if (S.busy) return;
    S.busy = true;
    S.players = S.players.filter(p => String(p.id) !== String(id));
    S.history = S.history.filter(m => String(m.id) !== String(id));
    delete S.pending[id];
    S.dialog = S.players.length ? { type:"edit" } : null;
    S.busy = false;
    render();
  },
  editColor(id, c) {
    if (!S.editDraft) return;
    if (usedColors(id).includes(c)) return;
    S.editDraft.color = c;
    render();
  },
  saveEdit(id) {
    const p = S.players.find(x => String(x.id) === String(id));
    if (!p || !S.editDraft) return;
    const name = S.editDraft.name.trim().slice(0, LIMITS.name);
    if (!name) { toast(t("nameEmpty")); return; }
    p.name = name;
    p.color = S.editDraft.color;
    S.editDraft = null;
    S.dialog = { type:"edit" };
    render();
  },
  openFinish() { openDialogFn({ type:"finish" }); },
  finishGame() { S.players = []; S.pending = {}; S.history = []; S.busy = false; setScreen("home"); restoreFocus(); },
  drawFirst() {
    if (!S.players.length) { S.dialog = null; render(); return; }
    const p = S.players[Math.floor(Math.random()*S.players.length)];
    S.dialog = { type:"drawResult", name:p.name };
    render();
  },
  askExitGame() {
    if (!S.players.length) { setScreen("home"); return; }
    const hasProgress = S.history.length > 0 || Object.keys(S.pending).length > 0;
    if (!hasProgress) { setScreen("home"); return; }
    openDialogFn({ type:"exitGame" });
  },

  /* zapis / odczyt stanu gry */
  openSaveDialog(goHome) {
    const suggested = S.players.map(p => p.name).join(", ") + " – " + new Date().toLocaleDateString(locale());
    openDialogFn({ type:"saveGame", goHome: !!goHome, name: suggested });
  },
  doSaveGame() {
    const d = S.dialog;
    if (!d || d.type !== "saveGame" || S.busy) return; // blokada podwójnego kliknięcia
    S.busy = true;
    const name = (d.name || "").trim().slice(0, LIMITS.saveName) || (t("saveWord") + " " + new Date().toLocaleString(locale()));
    const entry = {
      id: newId(), name: name, savedAt: Date.now(),
      players: JSON.parse(JSON.stringify(S.players)),
      history: JSON.parse(JSON.stringify(S.history)),
      nextId: S.nextId
    };
    S.saves.unshift(entry);
    if (S.saves.length > LIMITS.saves) S.saves.length = LIMITS.saves;
    saveSaves(S.saves);
    const goHome = d.goHome;
    S.busy = false;
    toast(t("gameSaved"));
    if (goHome) { ACTIONS.finishGame(); } else { S.dialog = null; render(); restoreFocus(); }
  },
  askLoadSave(id) { openDialogFn({ type:"confirmLoadSave", id:id, warn: S.players.length > 0 }); },
  doLoadSave(id) {
    const s = S.saves.find(x => x.id === id);
    if (!s) { closeDialog(); return; }
    const players = sanitizePlayers(s.players) || [];
    if (!players.length) { toast(t("invalidData")); closeDialog(); return; }
    S.players = players;
    S.history = Array.isArray(s.history) ? s.history.filter(h => Logic.findPlayer(S, h.id)) : [];
    S.nextId = Number(s.nextId) || players.length;
    S.pending = {};
    S.cardCache = null; // wymusza pełne przebudowanie kart
    S.dialog = null;
    S.screen = "game";
    render(); window.scrollTo(0,0);
  },
  askDeleteSave(id) {
    const s = S.saves.find(x => x.id === id);
    if (!s) return;
    openDialogFn({ type:"confirmDeleteSave", id:id, name:s.name });
  },
  confirmDeleteSaveFn(id) {
    S.saves = S.saves.filter(x => x.id !== id);
    saveSaves(S.saves);
    closeDialog();
  },

  /* ustawienia */
  changeFontScale(delta) {
    let v = Math.round((S.settings.fontScale + delta) * 10) / 10;
    v = Math.max(0.8, Math.min(1.6, v));
    S.settings.fontScale = v;
    applyFontScale();
    saveSettings();
    render();
  },
  setLang(lang) {
    if (lang !== "pl" && lang !== "en") return;
    if (S.settings.lang === lang) return;
    S.settings.lang = lang;
    applyLang();
    saveSettings();
    render();
  },
  addButtonValue() {
    if (S.settings.buttonValues.length >= MAX_BUTTON_PAIRS) { toast(t("maxPairs").replace("{n}", MAX_BUTTON_PAIRS)); return; }
    const existing = S.settings.buttonValues;
    let candidate = 5;
    while (existing.indexOf(candidate) >= 0) candidate++;
    existing.push(candidate);
    saveSettings(); render();
  },
  removeButtonValue(index) {
    const vals = S.settings.buttonValues.slice().sort((a,b)=>a-b);
    if (vals.length <= 1) return;
    const v = vals[index];
    S.settings.buttonValues = S.settings.buttonValues.filter(x => x !== v);
    saveSettings(); render();
  },
  updateButtonValue(index, raw) {
    const vals = S.settings.buttonValues.slice().sort((a,b)=>a-b);
    const s = String(raw == null ? "" : raw).trim();
    if (!/^\d+$/.test(s)) { toast(t("numRange")); render(); return; }
    const n = parseInt(s, 10);
    if (n < 1 || n > 9999) { toast(t("numRange")); render(); return; }
    if (vals.indexOf(n) >= 0 && vals[index] !== n) { toast(t("valueExists")); render(); return; }
    vals[index] = n;
    S.settings.buttonValues = vals;
    saveSettings(); render();
  },

  /* eksport / import */
  exportData() {
    if (S.busy) return;
    S.busy = true;
    try {
      const payload = { version: SCHEMA_VERSION, exportedAt: Date.now(), groups: S.groups, saves: S.saves, settings: S.settings };
      const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "licznik-kopia-zapasowa.json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast(t("exported"));
    } catch (e) { toast(t("exportErr")); }
    S.busy = false;
  },
  importClick() { const inp = document.getElementById("importFile"); if (inp) inp.click(); },
  cancelImport() { S.pendingImport = null; closeDialog(); },
  confirmImportData() {
    const data = S.pendingImport;
    if (!data) { closeDialog(); return; }
    if (S.busy) return;
    S.busy = true;
    S.groups = data.groups;
    saveGroups(S.groups);
    S.saves = data.saves;
    saveSaves(S.saves);
    if (data.settings) {
      S.settings = data.settings;
      saveSettings();
      applyFontScale();
      applyLang();
    }
    S.pendingImport = null;
    S.dialog = null;
    S.busy = false;
    toast(t("imported"));
    render();
  },
  runTests() {
    const r = runSelfTests();
    toast(t(r.passed === r.total ? "testsOk" : "testsFail").replace("{p}", r.passed).replace("{t}", r.total));
  }
};

function handleImportFile(file) {
  if (!file) return;
  if (file.size > LIMITS.importBytes) { toast(t("importTooBig")); return; }
  const reader = new FileReader();
  reader.onload = function () {
    try {
      const data = JSON.parse(String(reader.result));
      const clean = validateImport(data);
      if (!clean) { toast(t("invalidData")); return; }
      S.pendingImport = clean; // import używa WYŁĄCZNIE danych po sanityzacji
      openDialogFn({
        type: "confirmImport",
        groupsCount: clean.groups.length,
        savesCount: clean.saves.length
      });
    } catch (e) { toast(t("badFile")); }
  };
  reader.onerror = function () { toast(t("fileReadErr")); };
  reader.readAsText(file);
  const inp = document.getElementById("importFile");
  if (inp) inp.value = "";
}

/* --- Delegacja zdarzeń: click / input / change / keydown --- */
document.addEventListener("click", function (e) {
  const el = e.target.closest("[data-a]");
  if (!el) return;
  const name = el.getAttribute("data-a");
  const fn = ACTIONS[name];
  if (!fn) return;
  let args = [];
  const p = el.getAttribute("data-p");
  if (p) { try { args = JSON.parse(decodeURIComponent(p)); } catch (err) { args = []; } }
  fn.apply(ACTIONS, args.concat([el, e]));
});

document.addEventListener("input", function (e) {
  const id = e.target.id;
  if (id === "nameInput") { S.setupName = e.target.value; }
  else if (id === "editName" && S.editDraft) { S.editDraft.name = e.target.value; }
  else if (id === "customAmountInput" && S.dialog) { S.dialog.value = e.target.value.replace(/[^0-9]/g, ""); }
  else if (id === "editHistoryInput" && S.dialog) { S.dialog.value = e.target.value.replace(/[^0-9]/g, ""); }
  else if (id === "saveGameName" && S.dialog) { S.dialog.name = e.target.value; }
});

document.addEventListener("change", function (e) {
  if (e.target.id === "importFile") { handleImportFile(e.target.files[0]); return; }
  if (e.target.getAttribute("data-a") === "updateButtonValue") {
    const p = e.target.getAttribute("data-p");
    let i = 0; try { i = JSON.parse(p)[0]; } catch (err) {}
    ACTIONS.updateButtonValue(i, e.target.value);
  }
});

document.addEventListener("keydown", function (e) {
  /* Escape zamyka dialog (poza obowiązkowym wyborem pierwszego gracza) */
  if (e.key === "Escape" && S.dialog && S.dialog.type !== "drawAsk") { closeDialog(); return; }

  /* Enter zatwierdza w polach tekstowych */
  if (e.key === "Enter") {
    const id = e.target.id;
    if (id === "nameInput") { e.preventDefault(); ACTIONS.addSetupPlayer(); }
    else if (id === "customAmountInput") { e.preventDefault(); ACTIONS.confirmCustomAmount(); }
    else if (id === "editHistoryInput") { e.preventDefault(); ACTIONS.saveHistoryEdit(); }
    else if (id === "saveGameName") { e.preventDefault(); ACTIONS.doSaveGame(); }
    return;
  }

  /* FOCUS TRAP: Tab krąży wewnątrz otwartego dialogu */
  if (e.key === "Tab" && S.dialog) {
    const dlg = document.querySelector(".dialog");
    if (!dlg) return;
    const focusables = Array.prototype.slice.call(dlg.querySelectorAll("button, input")).filter(x => !x.disabled);
    if (!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length - 1];
    const active = document.activeElement;
    if (!dlg.contains(active)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && active === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && active === last) { e.preventDefault(); first.focus(); }
  }
});

/* --- Inicjalizacja --- */

/* PWA: manifest wstrzyknięty jako data URI — aplikacja zostaje jednym plikiem.
   Uwaga: service worker NIE może być data URI (wymóg same-origin HTTPS)
   i nie działa z file:// — ale ta aplikacja jest offline z natury,
   bo nie wykonuje żadnych zapytań sieciowych. */
(function injectManifest() {
  try {
    const icon = "data:image/svg+xml," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">' +
      '<rect width="512" height="512" rx="96" fill="#0f172a"/>' +
      '<circle cx="256" cy="200" r="64" fill="#e2e8f0"/>' +
      '<rect x="150" y="300" width="212" height="52" rx="26" fill="#94a3b8"/></svg>');
    const manifest = {
      name: "Licznik Punktów", short_name: "Licznik",
      start_url: ".", display: "standalone",
      background_color: "#070a12", theme_color: "#0a0e17",
      icons: [{ src: icon, sizes: "512x512", type: "image/svg+xml", purpose: "any" }]
    };
    const link = document.createElement("link");
    link.rel = "manifest";
    link.href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(link);
  } catch (e) {}
})();

applyLang();
applyFontScale();
render();

/* Komunikat po odzyskaniu uszkodzonych danych */
if (STORE.recovered) setTimeout(function(){ toast(t(STORE.recoveredFromBak ? "storageCorrupt" : "storageCorruptNoBak")); }, 300);

/* Testy automatyczne: dopisz ?test do adresu strony */
if (/[?&]test\b/.test(location.search)) ACTIONS.runTests();
window.__licznikTests = runSelfTests;
</script>
