# ABAX Tracker — CI: testy + Lighthouse + dostępność
# Umieść jako: .github/workflows/ci.yml
#
# Joby:
#   1. tests — aplikacja w prawdziwej przeglądarce (Playwright):
#        a) brak błędów konsoli przy starcie
#        b) wbudowany harness ?test — wynik czytamy z window.__abaxTests()
#        c) E2E przepływ gry: NOWA GRA → gracz → GRAJ → tap +1 → ✓ → wynik 1
#           (regresyjny test błędu F1: pierwszy tap musiał od razu pokazać ✓/✕)
#        d) kontrola wersji CACHE: zmiana plików z CORE wymaga podbicia numeru
#           w sw.js (komentarz w sw.js wreszcie mówi prawdę)
#   2. lighthouse — Lighthouse CI z progami (assert, C6)
#   3. a11y-axe  — axe-core/playwright: home, NOWA GRA, dialog gracza, USTAWIENIA,
#                  dialog kości ORAZ ekran gry z oknami (edycja składu, koniec gry)
#
# Uwaga: Playwright i http-server instalujemy LOKALNIE w katalogu ci-workdir
# (npm install -g + import w .mjs nie działa — Node nie widzi globalnych pakietów
# przy importach ES). Serwowanie aplikacji i uruchamianie testu w jednym kroku,
# bo proces w tle nie przeżywa końca kroku, gdy katalog zostanie sprzątnięty.
#
# TODO (docelowo): package.json + package-lock.json w repo i `npm ci` zamiast
# niepiętych wersji (C4); akcje przypiąć do commit-SHA i włączyć Dependabota
# dla ekosystemu github-actions.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# zasada najmniejszych uprawnień (C4)
permissions:
  contents: read

env:
  NODE_VERSION: '22'   # jedno LTS dla wszystkich jobów (C3)

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 2 — kontrola CACHE porównuje HEAD z HEAD~1,
      # domyślny shallow clone (depth 1) nie ma HEAD~1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps (lokalnie, nie globalnie)
        run: |
          mkdir -p ci-workdir
          cd ci-workdir
          npm init -y >/dev/null
          npm install --no-fund --no-audit playwright http-server

      - name: Install Chromium for Playwright
        run: |
          cd ci-workdir
          npx playwright install --with-deps chromium

      # Krok 2 planu naprawy (audyt): zmiana pliku z CORE bez podbicia CACHE = FAIL.
      # W przeciwnym razie użytkownicy zostają na starej wersji bezterminowo.
      - name: Kontrola wersji CACHE w sw.js
        run: |
          # pliki, których dotyczy numer CACHE (muszą zgadzać się z CORE w sw.js)
          CORE_FILES="index.html css/app.css js/app.js manifest.webmanifest"
          # hash aktualnej zawartości plików CORE
          CORE_HASH=$(cat $CORE_FILES | sha256sum | cut -c1-8)
          # numer CACHE z sw.js (ostatnie 8 znaków po "abax-tracker-")
          CACHE_LINE=$(grep -m1 'const CACHE = ' sw.js)
          echo "sw.js: $CACHE_LINE (hash CORE: $CORE_HASH)"
          if ! echo "$CACHE_LINE" | grep -q "$CORE_HASH"; then
            # numer nie odpowiada hashowi: dopuszczamy, jeśli podbicie nastąpiło
            # w tym samym commicie (diff dotyka sw.js) — sprawdzamy po prostu,
            # że przy zmianie któregokolwiek pliku CORE podbito i CACHE.
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -E "^(index.html|css/app.css|js/app.js|manifest.webmanifest)$" || true)
            if [ -n "$CHANGED" ]; then
              if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q "^sw.js$"; then
                echo "OK: pliki CORE zmienione, CACHE podbity w tym samym commicie"
              else
                echo "::error::Zmieniono plik(y) CORE: $CHANGED — podbij numer CACHE w sw.js"
                exit 1
              fi
            fi
          else
            echo "OK: CACHE zawiera hash aktualnych plików CORE"
          fi

      - name: Smoke test + harness ?test + E2E przepływ gry
        env:
          APP_DIR: ${{ github.workspace }}
        run: |
          cd ci-workdir
          cat > smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { spawn } from 'child_process';

          const BASE = 'http://127.0.0.1:8000';

          // start serwera w tle Z TEGO SAMEGO procesu testu
          const server = spawn('node', ['./node_modules/http-server/bin/http-server', process.env.APP_DIR, '-p', '8000', '--silent']);

          // czekamy, aż port naprawdę odpowie (nie sztywny sleep, C2)
          async function waitForPort(url, ms = 15000) {
            const deadline = Date.now() + ms;
            while (Date.now() < deadline) {
              try { await fetch(url); return true; }
              catch { await new Promise(r => setTimeout(r, 250)); }
            }
            return false;
          }

          let browser = null;
          async function main() {
            if (!(await waitForPort(BASE + '/index.html'))) {
              console.error('Serwer nie wystartował na czas'); process.exitCode = 1; return;
            }
            browser = await chromium.launch();
            const page = await browser.newPage();

            const errors = [];
            page.on('console', msg => { if (msg.type() === 'error') errors.push(msg.text()); });
            page.on('pageerror', err => errors.push(String(err)));

            // 1. Aplikacja ładuje się bez błędów konsoli
            await page.goto(BASE + '/index.html', { waitUntil: 'networkidle' });
            if (errors.length) {
              console.error('Błędy konsoli przy starcie:', errors);
              process.exitCode = 1; return;
            }

            // 2. Kluczowa struktura: kontener aplikacji + toast
            for (const sel of ['#app', '#toast']) {
              if (!(await page.locator(sel).count())) {
                console.error('Brak elementu: ' + sel);
                process.exitCode = 1; return;
              }
            }

            // 3. Wbudowany harness ?test — wynik bezpośrednio z runSelfTests() (C1):
            //    wyjątek w harnessie lub niezgodność passed/total = FAIL,
            //    komunikat o błędach trafia do logu, a job kończy się czerwono.
            await page.goto(BASE + '/index.html?test', { waitUntil: 'networkidle' });
            const r = await page.evaluate(() => {
              try {
                const res = window.__abaxTests();
                return { ok: true, passed: res.passed, total: res.total,
                         failed: res.results.filter(x => !x.ok).map(x => x.name) };
              } catch (e) {
                return { ok: false, error: String(e && e.stack ? e.stack : e) };
              }
            });
            if (!r.ok || r.passed !== r.total || errors.length) {
              console.error('Harness ?test nie przeszedł:', JSON.stringify(r, null, 2));
              if (errors.length) console.error('Błędy konsoli:', errors);
              process.exitCode = 1; return;
            }
            console.log(`OK: harness ?test (${r.passed}/${r.total})`);

            // 4. E2E: przepływ gry (regresja F1 z audytu — pierwszy tap +1 musi
            //    natychmiast pokazać sumę oczekującą i przyciski ✓/✕, a po ✓ wynik = 1)
            await page.goto(BASE + '/index.html', { waitUntil: 'networkidle' });
            await page.click('[data-a="newGame"]');
            await page.click('[data-a="openAddPlayer"]');
            await page.fill('#newPlayerName', 'Test');
            await page.click('[data-a="confirmAddPlayerName"]');
            // okno wyboru koloru: pierwszy wolny kolor, potem „DODAJ" (okno zamyka się dopiero po nim)
            await page.click('.dialog .colors button.dot:not([disabled])');
            await page.click('[data-a="confirmAddPlayer"]');
            await page.click('[data-a="startFromSetup"]');

            const firstTap = page.locator('[data-a="pend"][data-v="1"]').first();
            await firstTap.click();
            // PO PIERWSZYM TAPIE: wiersz ✓/✕ musi być widoczny natychmiast
            const confirmVisible = await page.locator('.confirm-row').first().isVisible();
            if (!confirmVisible) {
              console.error('REGRESJA F1: pierwszy tap +1 nie pokazał przycisków ✓/✕');
              process.exitCode = 1; return;
            }
            await page.click('[data-a="pendApply"]');
            const score = await page.locator('.score-num').first().textContent();
            if (score.trim() !== '1') {
              console.error('E2E: po ✓ wynik powinien być 1, jest: ' + score);
              process.exitCode = 1; return;
            }
            // cofnięcie i przywrócenie
            await page.click('[data-a="undo"]');
            const restore = page.locator('.toast-undo-btn');
            if (await restore.count()) {
              await restore.click();
              const score2 = await page.locator('.score-num').first().textContent();
              if (score2.trim() !== '1') {
                console.error('E2E: po PRZYWRÓĆ wynik powinien wrócić do 1, jest: ' + score2);
                process.exitCode = 1; return;
              }
            }
            console.log('OK: E2E przepływ gry (tap → ✓ → wynik 1, undo → przywróć)');
          }
          try {
            await main();
          } finally {
            if (browser) await browser.close().catch(() => {});
            server.kill();
          }
          EOF
          node smoke.mjs

  lighthouse:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Progi (C6): job NIE przechodzi, jeśli wynik spadnie poniżej baseline.
      - name: Write lighthouserc
        run: |
          cat > lighthouserc.json <<'EOF'
          {
            "ci": {
              "collect": {
                "staticDistDir": ".",
                "numberOfRuns": 3
              },
              "assert": {
                "assertions": {
                  "categories:accessibility": ["error", { "minScore": 0.95 }],
                  "categories:best-practices": ["error", { "minScore": 0.95 }],
                  "categories:performance": ["error", { "minScore": 0.9 }],
                  "categories:seo": ["warn", { "minScore": 0.9 }]
                }
              }
            }
          }
          EOF

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
          # Aplikacja mobile-first: domyślny preset (mobile).

  a11y-axe:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # C5: axe działa wewnątrz Playwright — jeden Chromium (nieparowana para
      # Chrome/ChromeDriver znika), skanujemy realne ekrany aplikacji, nie tylko home.
      - name: Install deps (lokalnie)
        run: |
          mkdir -p ci-workdir
          cd ci-workdir
          npm init -y >/dev/null
          npm install --no-fund --no-audit playwright @axe-core/playwright http-server

      - name: Install Chromium for Playwright
        run: |
          cd ci-workdir
          npx playwright install --with-deps chromium

      - name: axe scan (home, NOWA GRA, USTAWIENIA, dialogi)
        env:
          APP_DIR: ${{ github.workspace }}
        run: |
          cd ci-workdir
          cat > a11y.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { AxeBuilder } from '@axe-core/playwright';
          import { spawn } from 'child_process';

          const BASE = 'http://127.0.0.1:8000';
          const server = spawn('node', ['./node_modules/http-server/bin/http-server', process.env.APP_DIR, '-p', '8000', '--silent']);

          async function waitForPort(url, ms = 15000) {
            const deadline = Date.now() + ms;
            while (Date.now() < deadline) {
              try { await fetch(url); return true; }
              catch { await new Promise(r => setTimeout(r, 250)); }
            }
            return false;
          }

          // ekrany do skanowania: [nazwa, akcja prowadząca do ekranu]
          const SCREENS = [
            ['home', null],
            ['setup-nowa-gra', '[data-a="newGame"]'],
            ['setup-dodaj-gracza', '[data-a="openAddPlayer"]'],
            ['settings', '[data-a="openSettings"]'],
            ['settings-dodaj-kosc', '[data-a="addDie"]'],
          ];
          /* ekran gry + jego okna — najważniejszy ekran aplikacji, dawniej pomijany */
          const GAME_FLOW = async (page) => {
            await page.click('[data-a="newGame"]');
            await page.click('[data-a="openAddPlayer"]');
            await page.fill('#newPlayerName', 'A11y');
            await page.click('[data-a="confirmAddPlayerName"]');
            await page.click('.dialog .colors button.dot:not([disabled])');
            await page.click('[data-a="confirmAddPlayer"]');
            await page.click('[data-a="startFromSetup"]');
            return [
              ['gra', null],
              ['gra-edycja-skladu', '[data-a="openEdit"]'],
              ['gra-koniec-gry', '[data-a="openFinish"]'],
            ];
          };

          let browser = null;
          async function main() {
            if (!(await waitForPort(BASE + '/index.html'))) {
              console.error('Serwer nie wystartował na czas'); process.exitCode = 1; return;
            }
            browser = await chromium.launch();
            // AxeBuilder wymaga strony z osobnego kontekstu (browser.newContext()),
            // nie bezpośrednio z browser.newPage()
            const context = await browser.newContext();
            const page = await context.newPage();
            await page.goto(BASE + '/index.html', { waitUntil: 'networkidle' });

            let blocking = [];
            async function scanAll(screens) {
            for (const [name, action] of screens) {
              if (action) {
                const el = page.locator(action).first();
                if (await el.count()) { await el.click(); await page.waitForTimeout(150); }
                else { console.warn(`Pominięto ${name}: brak ${action}`); continue; }
              }
              const res = await new AxeBuilder({ page })
                .withTags(['wcag2a', 'wcag2aa', 'wcag21a', 'wcag21aa'])
                .analyze();
              const serious = res.violations.filter(v => ['critical', 'serious'].includes(v.impact));
              const moderate = res.violations.filter(v => v.impact === 'moderate');
              if (res.violations.length) {
                console.log(`[axe] ${name}: ${res.violations.length} naruszeń` +
                  ` (${serious.length} krytycznych/poważnych, ${moderate.length} umiarkowanych)`);
                for (const v of res.violations) {
                  console.log(`  - [${v.impact}] ${v.id}: ${v.help} (${v.nodes.length} węzłów)`);
                }
              } else {
                console.log(`[axe] ${name}: czysto`);
              }
              blocking = blocking.concat(serious.map(v => `${name}: [${v.impact}] ${v.id} — ${v.help}`));
              // powrót do home przed kolejnym ekranem
              if (action) {
                const back = page.locator('[data-a="closeDialog"], [data-a="backHome"]').first();
                if (await back.count()) { await back.click().catch(() => {}); await page.waitForTimeout(150); }
                const back2 = page.locator('[data-a="backHome"]').first();
                if (await back2.count()) { await back2.click().catch(() => {}); await page.waitForTimeout(150); }
              }
            }
            }

            await scanAll(SCREENS);
            // ekran gry z oknami (krok 2 planu naprawy) — dawniej pomijany
            const gameScreens = await GAME_FLOW(page);
            await scanAll(gameScreens);

            // po ustaleniu baseline zamień poniższy blok na: if (blocking.length) → exit 1
            if (blocking.length) {
              console.error('NARUSZENIA KRYTYCZNE/POWAŻNE:\n' + blocking.join('\n'));
              process.exitCode = 1;
            } else {
              console.log('OK: brak naruszeń krytycznych/poważnych WCAG 2.x AA');
            }
          }
          try {
            await main();
          } finally {
            if (browser) await browser.close().catch(() => {});
            server.kill();
          }
          EOF
          node a11y.mjs
