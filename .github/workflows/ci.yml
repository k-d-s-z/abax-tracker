# ABAX Tracker — CI: testy + Lighthouse + dostępność
# Umieść jako: .github/workflows/ci.yml
#
# Joby:
#   1. tests      — aplikacja w prawdziwej przeglądarce (Playwright): brak błędów konsoli
#                   + wbudowany harness ?test (szukamy "[FAIL]" w konsoli)
#   2. lighthouse — Lighthouse CI na statycznej stronie (bez builda)
#   3. a11y-axe   — skan dostępności axe (WCAG 2.x AA)
#
# Uwaga: Playwright i http-server instalujemy LOKALNIE w katalogu ci-workdir
# (npm install -g + import w .mjs nie działa — Node nie widzi globalnych pakietów
# przy importach ES). Serwowanie aplikacji i uruchamianie testu w jednym kroku,
# bo proces w tle nie przeżywa końca kroku, gdy katalog zostanie sprzątnięty.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (lokalnie, nie globalnie)
        run: |
          mkdir -p ci-workdir
          cd ci-workdir
          npm init -y >/dev/null
          npm install --no-fund --no-audit playwright http-server

      - name: Install Chromium for Playwright
        run: |
          cd ci-workdir
          npx playwright install --with-deps chromium

      - name: Smoke test + wbudowany harness ?test
        env:
          APP_DIR: ${{ github.workspace }}
        run: |
          cd ci-workdir
          cat > smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { spawn } from 'child_process';

          const BASE = 'http://127.0.0.1:8000';

          // start serwera w tle Z TEGO SAMEGO procesu testu — nie może zginąć między krokami
          const server = spawn('node', ['./node_modules/http-server/bin/http-server', process.env.APP_DIR, '-p', '8000', '--silent']);
          await new Promise(r => setTimeout(r, 2000)); // chwila na start serwera

          try {
            const browser = await chromium.launch();
            const page = await browser.newPage();

            const errors = [];
            page.on('console', msg => { if (msg.type() === 'error') errors.push(msg.text()); });
            page.on('pageerror', err => errors.push(String(err)));

            // 1. Aplikacja ładuje się bez błędów konsoli
            await page.goto(BASE + '/index.html', { waitUntil: 'networkidle' });
            if (errors.length) {
              console.error('Błędy konsoli przy starcie:', errors);
              process.exit(1);
            }

            // 2. Kluczowa struktura: kontener aplikacji + toast
            for (const sel of ['#app', '#toast']) {
              if (!(await page.locator(sel).count())) {
                console.error('Brak elementu: ' + sel);
                process.exit(1);
              }
            }

            // 3. Wbudowany harness ?test — runSelfTests() loguje "[OK ] nazwa" / "[FAIL] nazwa"
            await page.goto(BASE + '/index.html?test', { waitUntil: 'networkidle' });
            await page.waitForTimeout(2000);
            const fails = errors.filter(e => /\[FAIL\]/.test(e));
            if (fails.length) {
              console.error('Wbudowany harness zgłosił błędy:\n' + fails.join('\n'));
              process.exit(1);
            }

            console.log('OK: smoke + harness ?test');
            await browser.close();
          } finally {
            server.kill();
          }
          EOF
          node smoke.mjs

  lighthouse:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3
          # Aplikacja mobile-first: domyślny preset (mobile).
          # Progi dokręć do baseline po pierwszym stabilnym przebiegu.

  a11y-axe:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (lokalnie)
        run: |
          mkdir -p ci-workdir
          cd ci-workdir
          npm init -y >/dev/null
          npm install --no-fund --no-audit @axe-core/cli http-server

      - name: axe scan (ekran główny)
        env:
          APP_DIR: ${{ github.workspace }}
        run: |
          cd ci-workdir
          node ./node_modules/http-server/bin/http-server "$APP_DIR" -p 8000 --silent &
          SERVER_PID=$!
          sleep 2
          npx axe http://127.0.0.1:8000/index.html --exit --tags wcag2a,wcag2aa,wcag21a,wcag21aa
          RC=$?
          kill $SERVER_PID
          exit $RC
