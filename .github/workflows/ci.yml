# Umieść jako: .github/dependabot.yml
# Dependabot pilnuje wersji akcji GitHub używanych w .github/workflows/ci.yml
# (checkout, setup-node, lighthouse-ci-action). Wersje npm w ci-workdir są
# instalowane ad-hoc w jobach, więc dla npm/Playwright pilnowanie lockfile'a
# zostaje jako TODO razem z package.json w repo.

version: 2
updates:
  # aktualizacje akcji GitHub w workflowach
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    # tylko poprawki i minor — major wersje akcji przeglądamy ręcznie
    open-pull-requests-limit: 5
