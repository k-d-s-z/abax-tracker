# ABAX Tracker — konfiguracja Dependabota
# Umieść jako: .github/dependabot.yml
#
# UWAGA: to NIE jest plik workflow. Prawidłowa lokalizacja to .github/dependabot.yml
# (poza katalogiem workflows). Plik .github/workflows/dependabot.yml z audytu
# to uszkodzona kopia CI i należy go USUNĄĆ.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
